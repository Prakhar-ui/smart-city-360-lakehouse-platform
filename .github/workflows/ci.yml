name: CI

on:
  push:
    branches:
      - main

jobs:
  producer-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: producers

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Producer Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Producer Tests
        run: |
          pytest tests -v

      - name: Validate Producer Docker Build
        run: |
          docker build -t smartcity360-producers .

  spark-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spark

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Spark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark pytest


      - name: Debug Directory Structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files in current directory:"
          ls -la

          echo ""
          echo "Repository structure:"
          find . -type f | sort

      - name: Run Spark Tests
        run: |
          pytest tests -v