name: Spark Tests

on:
  push:
    branches:
      - main

jobs:

  spark-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spark

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pyspark pytest

      - name: Run Tests
        run: |
          pytest tests -v